<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jcastanodev - Gatitos band</title>
  <link rel="shortcut icon" href="../../assets/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="./index.css?v=1" />
</head>

<body>
  <header class="bar">
    <h1>Gatitos band</h1>
    <label>Tonalidad <select id="key"></select></label>
    <label>Escala <select id="scale"></select></label>
    <label>BPM <input id="bpm" type="range" min="60" max="180" /> <output id="bpmOut"></output></label>
    <button id="play">▶ Tocar banda</button>
    <button id="reset" class="ghost">Restablecer</button>
  </header>

  <main>
    <canvas id="stage" aria-label="Escenario de la banda"></canvas>
    <p class="hint">Click en un gatito o teclas 1-3 para tocar.</p>
    <section id="panel" class="panel"></section>
  </main>

  <script type="module" src="./js/main.js?v=1"></script>
</body>

</html>
