ed": true, "img": "https://speedlogic.com.co/wp-content/uploads/2025/08/16571_4.png"}, {"id": "iceberg-wave-m", "name": "Iceberg Wave Negro mATX (3 fans)", "price": 330000, "store": "TigerTech", "links": [{"label": "TigerTech", "url": "https://tigercomputadores.com/producto/gabinete-gamer-iceberg-wave-negro-m-atx-3-fans/"}], "pros": ["Estética pecera compacta"], "cons": ["Caro para el presupuesto", "Solo mATX"], "tier": "bronce", "compat": "mATX", "verified": true, "img": "https://tigercomputadores.com/wp-content/uploads/ICEBERG-WAVE-png.avif"}], "cooler": [{"id": "stock", "name": "Incluido con el CPU (Wraith Stealth)", "price": 0, "store": "Incluido", "links": [], "pros": ["Costo cero", "Suficiente para 65W"], "cons": ["Ruidoso con carga", "El 5700X no lo trae"], "tier": "oro", "compat": "", "verified": true, "img": ""}, {"id": "thermalright-ax120-se", "name": "Thermalright Assassin X120 Refined SE", "price": 90000, "store": "TigerTech (transferencia/efectivo)", "links": [{"label": "TigerTech", "url": "https://tigercomputadores.com/producto/cooler-cpu-thermalright-assassin-x120-refined-se-negro/"}, {"label": "Tienda Akiba (V2 White, $109.900)", "url": "https://tiendaakiba.com/partes-de-computador/disipadores-cpu/disipador-cpu-thermalright-assassin-x-120-refined-se-v2-white-refrigeracion-por-aire/"}], "pros": ["Torre 4 heatpipes barata", "Mucho más silencioso"], "cons": ["Gasto extra de 90k"], "tier": "plata", "compat": "AM4 / LGA1700", "verified": true, "img": "https://tigercomputadores.com/wp-content/uploads/2026/09/ASSASIN-BLACK.webp"}, {"id": "aerocool-rave4-argb", "name": "Aerocool Rave 4 ARGB", "price": 114900, "store": "Tienda Akiba", "links": [{"label": "Tienda Akiba", "url": "https://tiendaakiba.com/partes-de-computador/disipadores-cpu/disipador-cpu-aerocool-rave-4-argb-refrigeracion-por-aire/"}], "pros": ["ARGB, en stock"], "cons": ["Rinde menos que el Assassin"], "tier": "bronce", "compat": "AM4 / LGA1700", "verified": true, "img": "https://tiendaakiba.com/wp-content/uploads/disipador-cpu-aerocool-rave-4-argb-refrigeracion-por-aire-foto-1-1.webp"}, {"id": "aerocool-air-frost-plus", "name": "Aerocool Air Frost Plus", "price": 65900, "store": "Tienda Akiba", "links": [{"label": "Tienda Akiba", "url": "https://tiendaakiba.com/partes-de-computador/disipadores-cpu/disipador-cpu-aerocool-air-frost-plus-refrigeracion-por-aire/"}], "pros": ["Muy barato, en stock"], "cons": ["Apenas mejor que el de stock"], "tier": "bronce", "compat": "AM4 / LGA1700", "verified": true, "img": "https://tiendaakiba.com/wp-content/uploads/disipador-cpu-aerocool-air-frost-plus-refrigeracion-por-aire-foto-1-1.webp"}]};
let RECOMMENDED={"cpu": "r5-5600", "mobo": "msi-b550m-a-pro", "ram": "kingston-16gb-3200", "gpu": "rx-6600", "ssd": "patriot-p300-500", "psu": "xpg-probe-700", "case": "iceberg-clacius", "cooler": "stock"};
let NOTES="Precios verificados en tiendas colombianas (nov. 2026), en su mayoría por transferencia o efectivo: con tarjeta suben cerca de 19%. La RAM está cara en 2026, por eso el build recomendado usa 1x16 GB (single channel). Algunas piezas son últimas unidades o están agotadas.";
const BUDGET=3000000;

/* ---------- Estado ---------- */
let sel={};
try{sel=JSON.parse(localStorage.getItem('pc3m-sel')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('pc3m-sel',JSON.stringify(sel))}catch(e){}};
const fmt=n=>'$'+n.toLocaleString('es-CO');
const item=(k,id)=>(DATA[k]||[]).find(i=>i.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const sock=it=>(it&&it.compat||'').split(/[ \/]/)[0];
function incompatible(k,it){
  const cpu=item('cpu',sel.cpu), mobo=item('mobo',sel.mobo);
  if(k==='mobo'&&cpu&&sock(it)!==sock(cpu)) return 'No compatible con '+sock(cpu);
  if(k==='cpu'&&mobo&&sock(it)!==sock(mobo)) return 'No compatible con '+sock(mobo);
  if(k==='cooler'&&it.id==='stock'&&cpu&&/5700X/.test(cpu.name)) return 'Tu CPU no lo incluye';
  return '';
}

function render(){
  const main=document.getElementById('cats');
  main.innerHTML=CATS.map(c=>{
    const items=DATA[c.k]||[];
    const s=item(c.k,sel[c.k]);
    return `<section class="cat" id="c-${c.k}">
      <div class="ch"><div class="ic">${ICONS[c.k]('#5ee6b0')}</div><h2>${c.n}</h2>
        <div class="sel">${s?`<b>${fmt(s.price)}</b>`:'sin elegir'}</div></div>
      <div class="row">${items.map(it=>{
        const inc=incompatible(c.k,it);
        return `<div class="card ${sel[c.k]===it.id?'on':''} ${inc?'inc':''}" data-k="${c.k}" data-id="${it.id}" style="${sel[c.k]===it.id?'':`border-color:${TIERHEX[it.tier]}33`}">
          <div class="img" style="background:radial-gradient(circle at 50% 40%,${TIERHEX[it.tier]}22,transparent 70%)">
            ${ICONS[c.k](TIERHEX[it.tier])}${it.img?`<img class="ph" src="${esc(it.img)}" alt="${esc(it.name)}" loading="lazy" referrerpolicy="no-referrer" onload="this.parentNode.classList.add('has')" onerror="this.remove()">`:''}
            <span class="medal" style="background:${TIER[it.tier]}">${it.tier}</span></div>
          <div class="n">${esc(it.name)}</div>
          <div class="p">${it.price?fmt(it.price):'Incluido'}</div>
          <div class="tag">${inc?esc(inc):esc([it.compat,it.verified===false?'precio aprox.':''].filter(Boolean).join(' · '))}</div>
        </div>`}).join('')}</div>
      <div class="detail" id="d-${c.k}"></div>
    </section>`}).join('');
  CATS.forEach(c=>showDetail(c.k,sel[c.k]));
  main.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('mouseenter',()=>showDetail(el.dataset.k,el.dataset.id));
    el.addEventListener('mouseleave',()=>showDetail(el.dataset.k,sel[el.dataset.k]));
    el.addEventListener('click',()=>{
      const k=el.dataset.k,id=el.dataset.id;
      sel[k]=sel[k]===id?undefined:id; if(!sel[k])delete sel[k];
      save(); render();
    });
  });
  renderSlots(); renderTotal();
}

function showDetail(k,id){
  const d=document.getElementById('d-'+k); if(!d)return;
  const it=item(k,id);
  if(!it){d.innerHTML='<div class="hint">Pasa el cursor sobre una opción para ver ventajas y desventajas · clic para elegir</div>';return}
  d.innerHTML=`<div class="who"><b>${esc(it.name)}</b>${it.store?' · '+esc(it.store):''}</div>
   <ul class="pro">${(it.pros||[]).map(p=>`<li>${esc(p)}</li>`).join('')}</ul>
   <ul class="con">${(it.cons||[]).map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`;
}

function renderSlots(){
  document.getElementById('slots').innerHTML=CATS.map(c=>{
    const it=item(c.k,sel[c.k]);
    return `<div class="slot ${it?'':'empty'}" data-go="${c.k}"><div class="ic">${ICONS[c.k](it?TIERHEX[it.tier]:'#3a4256')}</div>
      <div class="nm">${it?esc(it.name):c.n}<small>${it?(it.price?fmt(it.price):'Incluido'):'—'}</small></div>
      <span class="pip" style="${it?`background:${TIERHEX[it.tier]}`:''}"></span></div>`}).join('');
  document.querySelectorAll('.slot').forEach(s=>s.onclick=()=>document.getElementById('c-'+s.dataset.go).scrollIntoView({behavior:'smooth'}));
}

function totals(){
  let t=0,n=0; CATS.forEach(c=>{const it=item(c.k,sel[c.k]); if(it){t+=it.price;n++}}); return {t,n};
}
function renderTotal(){
  const {t,n}=totals(), over=t>BUDGET, pct=Math.min(t/BUDGET,1);
  document.getElementById('fTotal').textContent=fmt(t);
  document.getElementById('fSub').innerHTML=`${n} de ${CATS.length} piezas · ${over?`<b style="color:var(--bad)">+${fmt(t-BUDGET)} sobre</b>`:`<b style="color:var(--acc)">${fmt(BUDGET-t)} libres</b>`}`;
  document.getElementById('float').classList.toggle('over',over);
  const arc=document.getElementById('ringArc'); arc.style.strokeDashoffset=113.1*(1-pct); arc.setAttribute('stroke',over?'#ff6b6b':'#5ee6b0');
  const m=document.getElementById('meter'); m.classList.toggle('over',over); m.firstElementChild.style.width=(pct*100)+'%';
  document.getElementById('mUsed').textContent=fmt(t)+' usados';
}

function openSummary(){
  const {t,n}=totals(), over=t>BUDGET;
  const rows=CATS.map(c=>{const it=item(c.k,sel[c.k]); if(!it)return '';
    return `<div class="li"><div class="ic">${ICONS[c.k](TIERHEX[it.tier])}</div>
      <div class="m"><div class="c">${c.n} · <span style="color:${TIERHEX[it.tier]}">${it.tier}</span></div><div class="nm">${esc(it.name)}</div><div style="font-size:12px;color:var(--mut)">${esc(it.store||"")}</div>
      <div class="links">${(it.links||[]).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join('')||'<span style="font-size:12px;color:var(--mut)">Viene con el procesador</span>'}</div></div>
      <div class="pr">${it.price?fmt(it.price):'$0'}</div></div>`}).join('');
  const cpu=item('cpu',sel.cpu),mobo=item('mobo',sel.mobo);
  const miss=CATS.filter(c=>!sel[c.k]).map(c=>c.n);
  let warn='';
  if(cpu&&mobo&&sock(cpu)!==sock(mobo)) warn+=`<div class="warn">⚠ ${esc(cpu.name)} (${sock(cpu)}) no encaja en ${esc(mobo.name)} (${sock(mobo)}).</div>`;
  if(cpu&&/5700X/.test(cpu.name)&&sel.cooler==='stock') warn+=`<div class="warn">⚠ El Ryzen 7 5700X no trae disipador: elige uno.</div>`;
  if(miss.length) warn+=`<div class="warn" style="background:rgba(245,192,70,.08);border-color:rgba(245,192,70,.3);color:#f5d68a">Falta: ${miss.join(', ')}</div>`;
  document.getElementById('sheet').innerHTML=`<button class="x" id="xClose">×</button>
    <h2>Resumen del build</h2><div class="sub">${n} piezas · ${over?'sobre el presupuesto':'dentro del presupuesto'}</div>
    ${warn}${rows||'<div class="sub">Aún no eliges componentes.</div>'}
    <div class="tot"><span>Total</span><b style="color:${over?'var(--bad)':'var(--acc)'}">${fmt(t)}</b></div>
    <div class="sub" style="margin:0">${over?`Te pasas por ${fmt(t-BUDGET)}`:`Te sobran ${fmt(BUDGET-t)}`} de $3.000.000</div>
    <div class="acts"><button class="btn pri" id="bCopy">Copiar lista</button><button class="btn" id="bClose2">Seguir armando</button></div>
    <div class="note">${esc(NOTES)} Precios de referencia; confirma stock y precio en la tienda antes de comprar.</div>`;
  document.getElementById('modal').classList.add('open');
  document.getElementById('xClose').onclick=document.getElementById('bClose2').onclick=closeSummary;
  document.getElementById('bCopy').onclick=async e=>{
    const txt=CATS.map(c=>{const it=item(c.k,sel[c.k]);return it?`${c.n}: ${it.name} — ${fmt(it.price)}${it.links&&it.links[0]?' — '+it.links[0].url:''}`:''}).filter(Boolean).join('\n')+`\nTOTAL: ${fmt(t)}`;
    try{await navigator.clipboard.writeText(txt);e.target.textContent='¡Copiado!'}catch(err){e.target.textContent='No se pudo copiar'}
  };
}
function closeSummary(){document.getElementById('modal').classList.remove('open')}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeSummary()};
document.getElementById('float').onclick=openSummary;
document.getElementById('float').onkeydown=e=>{if(e.key==='Enter')openSummary()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSummary()});
document.getElementById('bRec').onclick=()=>{sel={...RECOMMENDED};save();render()};
document.getElementById('bClear').onclick=()=>{sel={};save();render()};

// limpia selecciones que ya no existen
Object.keys(sel).forEach(k=>{if(!item(k,sel[k]))delete sel[k]});
if(!Object.keys(sel).length) sel={...RECOMMENDED};
render();
</script>
</body>
</html>
